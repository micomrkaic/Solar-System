<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3D Solar System</title>
  <link rel="icon" href="data:,">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; background: #000;
      overflow: hidden; font-family: 'Courier New', monospace;
    }
    #wrapper {
      position: relative; width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
    }
    /* The C side sizes the back-buffer to this element's physical pixel
       size (CSS px × devicePixelRatio, 16:9) and sets the CSS size inline
       via _fitCss(), so every device pixel maps 1:1: crisp at any zoom or
       DPR, no browser resampling.  These are only pre-init defaults.    */
    canvas#canvas {
      display: block; max-width: 100%; max-height: 100%;
      aspect-ratio: 16 / 9; outline: none;
    }
    #loading {
      position: absolute; inset: 0; z-index: 10;
      display: flex; flex-direction: column; gap: 14px;
      align-items: center; justify-content: center;
      background: #000; color: #aaa; font-size: 14px;
      transition: opacity 0.4s ease;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    #loading-title { color: #ffdc32; font-size: 20px; letter-spacing: 2px; text-transform: uppercase; }
    #status-text   { color: #666; font-size: 12px; }
  </style>
</head>
<body>
<div id="wrapper">
  <div id="loading">
    <div id="loading-title">3D Solar System</div>
    <div id="status-text">Initialising…</div>
  </div>
  <!-- SDL2/Emscripten renders here; the id must be "canvas". -->
  <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
</div>

<script>
  /* ── Disable resizable Wasm heap (emcc 6.0.2 GROWABLE_ARRAYBUFFERS=1) ──
     That release's runtime does `try { wasmMemory.toResizableBuffer() }
     catch {}` and otherwise falls back to the fixed-length buffer.  A
     resizable heap breaks TextDecoder.decode(), WebGL texSubImage2D and
     other Web APIs.  Making the method throw forces the safe fallback on
     any emcc version.  (Also fixed via -sGROWABLE_ARRAYBUFFERS=0.)       */
  (function () {
    try {
      var P = WebAssembly.Memory.prototype;
      if ('toResizableBuffer' in P) {
        Object.defineProperty(P, 'toResizableBuffer', {
          value: function () { throw new TypeError('toResizableBuffer disabled'); },
          configurable: true, writable: true
        });
      }
    } catch (e) {}
  })();

  var loadingEl = document.getElementById('loading');
  var statusEl  = document.getElementById('status-text');
  var canvas    = document.getElementById('canvas');
  var wrapper   = document.getElementById('wrapper');

  /* ── Device-pixel sizing ──────────────────────────────────────────
     Measure the largest 16:9 box that fits the wrapper, in physical
     pixels.  C reads window._devW at start-up and polls it each frame;
     after resizing its back-buffer it calls _fitCss(W,H) so the CSS size
     is exactly W/dpr × H/dpr.                                           */
  function measureDev() {
    var dpr = window.devicePixelRatio || 1;
    var cw = wrapper.clientWidth, ch = wrapper.clientHeight;
    var w = Math.min(cw, ch * 16 / 9);
    window._devW = Math.max(1, Math.round(w * dpr));
  }
  measureDev();
  var _rt = null;
  window.addEventListener('resize', function () {
    clearTimeout(_rt);
    _rt = setTimeout(measureDev, 200);        /* debounce */
  });
  window._fitCss = function (W, H) {
    var dpr = window.devicePixelRatio || 1;
    canvas.style.width  = (W / dpr) + 'px';
    canvas.style.height = (H / dpr) + 'px';
    canvas.style.maxWidth = 'none'; canvas.style.maxHeight = 'none';
  };

  /* SDL2 reads the keyboard from the focused canvas; itch.io/Pages embeds
     start unfocused, so grab focus on load and on any click.            */
  canvas.addEventListener('mousedown', function () { canvas.focus(); });
  window.addEventListener('load',      function () { canvas.focus(); });

  var Module = {
    canvas: canvas,
    print:    function (t) { console.log(t);  },
    printErr: function (t) { console.warn(t); },
    setStatus: function (text) { if (text) statusEl.textContent = text; },
    onRuntimeInitialized: function () {
      statusEl.textContent = 'Ready';
      loadingEl.classList.add('hidden');
      setTimeout(function () { loadingEl.style.display = 'none'; canvas.focus(); }, 450);
    }
  };

  window.addEventListener('error', function (e) {
    statusEl.textContent = 'Error: ' + (e.message || 'unknown');
    statusEl.style.color = '#f55';
  });
</script>

{{{ SCRIPT }}}
</body>
</html>
